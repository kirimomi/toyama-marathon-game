<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>富山マラソンゲーム（仮）</title>
<meta name="description" content="富山マラソンをテーマにしたミニゲーム。制作中。">
<meta name="theme-color" content="#0d2a4a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="富山ゲーム">
<style>
  :root{
    color-scheme: light;
    --bg:#eef3f8; --card:#ffffff; --text:#16283c; --sub:#5c7186; --accent:#0d6fc4;
  }
  @media (prefers-color-scheme: dark){
    :root{ color-scheme: dark; --bg:#0a1622; --card:#14273c; --text:#eef4fa; --sub:#93a9bd; --accent:#4db2ff; }
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    padding:calc(20px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
  }
  main{ max-width:560px; margin:0 auto; }
  h1{ font-size:24px; margin:8px 0 4px; }
  .sub{ color:var(--sub); font-size:14px; margin:0 0 16px; }
  .card{
    background:var(--card); border-radius:16px; padding:20px 18px;
    box-shadow:0 1px 3px rgba(10,30,60,.08); line-height:1.8; font-size:15px;
  }
  .card h2{ font-size:16px; margin:0 0 8px; }
  .card ul{ margin:8px 0; padding-left:20px; }
  .note{ color:var(--sub); font-size:13px; margin-top:14px; }
  .scene{ font-size:44px; text-align:center; margin:6px 0 2px; }
</style>
</head>
<body>
<main>
  <div class="scene">⛰️🏃</div>
  <h1>富山マラソンゲーム（仮）</h1>
  <p class="sub">富山マラソンをテーマにしたミニゲームの会場です。</p>

  <div class="card">
    <h2>準備中</h2>
    何を作るかは、仲間と合流してから話して決めます。いまの候補はこの2つ。
    <ul>
      <li><b>富山ランナー</b>：タップでジャンプして42.195km完走を目指す。途中で力尽きると「○○km地点でDNF」</li>
      <li><b>富山名物ガチャ</b>：ます寿司・白エビ・ブラックラーメンなどを引いて集める図鑑型</li>
    </ul>
    決まったら、ここにそのままゲームが入ります。
    <p class="note">このページは PWA 対応です。スマホは「ホーム画面に追加」、PC は「アプリとしてインストール」で単独アプリとして置けます。</p>
  </div>
</main>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js')
    .then((reg) => { reg.update().catch(() => {}); })
    .catch(() => {});
}
</script>
</body>
</html>
