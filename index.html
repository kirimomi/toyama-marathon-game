<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>富山マラソン・アドベンチャー（前日編）</title>
<meta name="description" content="富山マラソンの旅の写真で進む、身内向けアドベンチャーゲーム。">
<meta name="theme-color" content="#0d2a4a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="富山ADV">
<style>
  :root{ color-scheme: dark; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body{ height:100%; }
  body{
    margin:0; background:#060d16; color:#eef4fa;
    font-family:-apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    overflow:hidden;
  }
  #app{ position:fixed; inset:0; display:flex; flex-direction:column; }

  /* ---------- top bar ---------- */
  #topbar{
    flex:0 0 auto; display:flex; align-items:center; gap:8px;
    padding:calc(8px + env(safe-area-inset-top)) 14px 8px;
    background:#0d2a4a; z-index:5;
  }
  #topbar .t{ font-size:14px; font-weight:700; letter-spacing:.04em; white-space:nowrap; }
  #sceneName{ font-size:12px; color:#9fc3e5; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bar-btn{
    font:inherit; font-size:12px; font-weight:700; color:#eef4fa;
    background:rgba(255,255,255,.12); border:none; border-radius:999px; padding:6px 12px; cursor:pointer;
    white-space:nowrap;
  }
  .bar-btn:disabled{ opacity:.35; cursor:default; }
  #backBtn{ margin-left:auto; }

  /* ---------- stage ---------- */
  #stage{ position:relative; flex:1 1 auto; background:#000; overflow:hidden; cursor:pointer; }
  #photo{
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:contain; opacity:0; transition:opacity .45s ease;
  }
  #photo.show{ opacity:1; }
  #titleCard{
    position:absolute; inset:0; display:none; place-items:center; text-align:center;
    background:radial-gradient(120% 90% at 50% 10%, #16406e 0%, #0d2a4a 55%, #060d16 100%);
    padding:24px;
  }
  #titleCard.show{ display:grid; }
  #titleCard .emoji{ font-size:56px; }
  #titleCard h1{ font-size:27px; margin:10px 0 4px; letter-spacing:.03em; }
  #titleCard .sub2{ color:#9fc3e5; font-size:15px; font-weight:700; }
  #titleCard .hint{ color:#7d99b5; font-size:12px; margin-top:18px; line-height:1.7; }
  #clearNote{ color:#ffd166; font-size:12.5px; font-weight:700; margin-top:14px; display:none; }

  /* ---------- choices ---------- */
  #choices{
    position:absolute; left:0; right:0; bottom:12px; z-index:4;
    display:none; flex-direction:column; gap:10px; align-items:center; padding:0 18px;
  }
  #choices.show{ display:flex; }
  .choice{
    font:inherit; width:min(420px, 100%); padding:13px 16px; border-radius:12px; cursor:pointer;
    background:rgba(13,42,74,.92); color:#fff; border:1px solid rgba(159,195,229,.55);
    font-size:16px; font-weight:700; backdrop-filter:blur(4px);
  }
  .choice:active{ background:#1d5c96; }

  /* ---------- text window ---------- */
  #textwin{
    flex:0 0 auto; z-index:5; cursor:pointer;
    background:rgba(8,20,34,.96); border-top:1px solid rgba(159,195,229,.25);
    padding:14px 18px calc(16px + env(safe-area-inset-bottom));
    min-height:118px; user-select:none;
  }
  #text{ font-size:16.5px; line-height:1.75; white-space:pre-wrap; min-height:56px; }
  #nextMark{ text-align:right; color:#9fc3e5; font-size:12px; height:16px; animation:bob 1.1s ease-in-out infinite; }
  @keyframes bob{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(3px);} }
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <span class="t">富山ADV</span>
    <span id="sceneName">前日編</span>
    <button class="bar-btn" id="backBtn" type="button">← 戻る</button>
    <button class="bar-btn" id="restartBtn" type="button">最初から</button>
  </div>

  <div id="stage">
    <img id="photo" alt="">
    <div id="titleCard">
      <div>
        <div class="emoji">⛰️🏃</div>
        <h1>富山マラソン・<br>アドベンチャー</h1>
        <div class="sub2">〜 前日編 〜</div>
        <div id="clearNote">★ 前日編クリア済み ★</div>
        <div class="hint">画面タップで進みます<br>これは富山マラソンの旅の記録をもとにした身内向けゲームです</div>
      </div>
    </div>
    <div id="choices"></div>
  </div>

  <div id="textwin">
    <div id="text"></div>
    <div id="nextMark">▼</div>
  </div>
</div>

<script>
'use strict';

/* ===== story data =====
   scene: { name, img?, title?, lines[], next? , choices?[] }
   Add a scene = add one entry here and link it with next/choices. */
const SCENES = {
  title: {
    title: true, name: 'タイトル',
    lines: ['富山マラソン・アドベンチャー 〜前日編〜']
    /* choices are built dynamically (continue support) */
  },
  prologue: {
    name: 'プロローグ',
    lines: [
      '2026年10月31日。富山マラソンの前日。',
      '決戦を翌日に控えたランナーたちの、長い一日が始まる。'
    ],
    next: 'station'
  },
  station: {
    name: '富山駅', img: 'img/station.jpg',
    lines: [
      '富山駅。約束の場所に、仲間がひとり、またひとりと集まってくる。',
      '5人、全員集合。誰ひとり欠けることなく、遠征のスタートラインに立った。',
      'まずは各自のホテルへ荷物を預け、身軽になる。'
    ],
    next: 'boteyan'
  },
  boteyan: {
    name: 'ぼてやん', img: 'img/boteyan.jpg',
    lines: [
      '腹ごしらえに選んだのは、富山名物のお好み焼き「ぼてやん」。',
      'しかし、店の前に広がっていたのは——',
      '建物の中まで続く、大・行・列。'
    ],
    choices: [
      { t: '並ぶ', to: 'boteyan_wait' },
      { t: '諦める', to: 'boteyan_giveup' }
    ]
  },
  boteyan_wait: {
    name: 'ぼてやん', img: 'img/boteyan.jpg',
    lines: [
      '列に加わった。……が、列は微動だにしない。',
      '明日の42.195kmより、この列のほうが長く感じる。',
      'やむなく撤退。ぼてやんは来年の宿題になった。'
    ],
    next: 'reception'
  },
  boteyan_giveup: {
    name: 'ぼてやん', img: 'img/boteyan.jpg',
    lines: [
      '英断だった。本番前日に、行列で体力を使うわけにはいかない。',
      'ぼてやんは来年の宿題に回し、一行は受付会場へ向かった。'
    ],
    next: 'reception'
  },
  reception: {
    name: '受付', img: 'img/reception.jpg',
    lines: [
      'YKK APアリーナ。ランナー受付の会場は、全国から集まったランナーの熱気に包まれていた。',
      'ゼッケン番号ごとに分かれたブースで、明日の装備を受け取っていく。',
      '受付、完了。これで明日、走る資格を得た。'
    ],
    next: 'lottery'
  },
  lottery: {
    name: '抽選', img: 'img/mami.jpg',
    lines: [
      'そのとき、事件は起きた。',
      '会場の抽選で、マミが——',
      '商品券を、引き当てた！',
      'ゼッケンには誇らしげな「当選」のシール。幸先のいいスタートだ。'
    ],
    next: 'print1'
  },
  print1: {
    name: 'プリント体験', img: 'img/booth.jpg',
    lines: [
      '受付を終え、会場の一角にある Goldwin のブースへ。',
      '壁には、仕上がったばかりの参加賞Tシャツが誇らしげに掛かっている。'
    ],
    next: 'print2'
  },
  print2: {
    name: 'プリント体験', img: 'img/print.jpg',
    lines: [
      'ここでは、参加賞Tシャツに好きなマークを転写プリントできる。',
      '選んだのは、立山の雷鳥。「RUN THROUGH TOYAMA」の文字とともに、裾へ配置。'
    ],
    next: 'print3'
  },
  print3: {
    name: 'プリント体験', img: 'img/iron.jpg',
    lines: [
      'アイロンの熱で、じっくりと圧着していく。',
      '世界に1枚だけの、明日の戦闘服が完成した。'
    ],
    next: 'expo'
  },
  expo: {
    name: '高岡市ブース', img: 'img/expo.jpg',
    lines: [
      'エキスポの高岡市ブース。鋳物のまち高岡らしく、「梵鐘」をかぶって高岡大仏と撮れる撮影コーナーがあった。',
      'ノリオとマミ、梵鐘をかぶる。',
      '明日のスタート地・高岡の力を、頭から授かった——たぶん。'
    ],
    next: 'cowhee1'
  },
  cowhee1: {
    name: 'カウヒー', img: 'img/cowhee.jpg',
    lines: [
      '会場を出ると、いつの間にか雨は上がり、日が差していた。',
      '近くのコンビニで出会ったのが、富山のご当地コーヒー牛乳——その名も「カウヒー」。',
      '全員で買って、記念撮影。旅の味がした。'
    ],
    next: 'cowhee2'
  },
  cowhee2: {
    name: 'カウヒー', img: 'img/cowhee_pack.jpg',
    lines: [
      'パッケージの牛が、なんとも言えない味を出している。',
      'とやまアルペン乳業。富山に来た実感が、またひとつ増えた。'
    ],
    next: 'statue'
  },
  statue: {
    name: 'パン赤の像', img: 'img/statue.jpg',
    lines: [
      '街を歩いていると、広場に白い像が立っていた。',
      '一行が「パン赤の像」と呼んでいるものである。理由は、たぶん誰ももう覚えていない。',
      '明日の無事を、パン赤の像に祈っておいた。'
    ],
    next: 'cowhee3'
  },
  cowhee3: {
    name: '追いカウヒー', img: 'img/cowhee_bus.jpg',
    lines: [
      'やがて「追いカウヒー」という言葉が生まれた。',
      'バスの車内でも、カウヒーは手放せない。',
      'もはや富山の味に、どっぷりである。'
    ],
    next: 'ending'
  },
  ending: {
    name: 'エンディング',
    lines: [
      'こうして、前日の一日は過ぎていく。',
      '明日、9時。高岡をスタートし、42.195km先の環水公園を目指す。',
      '物語は、レース本番へ——つづく。'
    ],
    choices: [{ t: '最初から遊ぶ', to: 'title' }]
  }
};

/* ===== save keys ===== */
const SAVE_KEY = 'adv_save_v1';
const CLEAR_KEY = 'adv_cleared_v1';

/* ===== state ===== */
let sceneId = 'title';
let lineIdx = 0;
let history = [];       // [{scene, line}]
let typing = null;      // typewriter timer id
let fullLine = '';

const $ = (id) => document.getElementById(id);
const photoEl = $('photo');
const titleEl = $('titleCard');
const textEl = $('text');
const choicesEl = $('choices');
const nextMark = $('nextMark');

/* ===== save / load ===== */
function loadSave(){
  try { return JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); } catch (e) { return null; }
}
function persist(){
  if (sceneId === 'title') return;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({ scene: sceneId, line: lineIdx })); } catch (e) {}
  if (sceneId === 'ending') {
    try { localStorage.setItem(CLEAR_KEY, new Date().toISOString()); } catch (e) {}
  }
}

/* ===== typewriter ===== */
function stopTyping(){ if (typing !== null) { clearInterval(typing); typing = null; } }
function typeLine(text){
  stopTyping();
  fullLine = text;
  textEl.textContent = '';
  let i = 0;
  typing = setInterval(() => {
    i++;
    textEl.textContent = text.slice(0, i);
    if (i >= text.length) stopTyping();
  }, 26);
}
function finishLine(){
  if (typing !== null) { stopTyping(); textEl.textContent = fullLine; }
}

/* ===== choices for the title scene ===== */
function titleChoices(){
  const save = loadSave();
  const list = [];
  if (save && SCENES[save.scene] && save.scene !== 'title') {
    list.push({ t: 'つづきから', to: save.scene, line: save.line || 0 });
  }
  list.push({ t: save ? 'はじめから' : 'はじめる', to: 'prologue' });
  return list;
}

/* ===== rendering ===== */
function render(){
  const s = SCENES[sceneId];
  titleEl.classList.toggle('show', !!s.title);
  $('clearNote').style.display = localStorage.getItem(CLEAR_KEY) ? 'block' : 'none';
  if (s.img) {
    if (photoEl.getAttribute('src') !== s.img) photoEl.src = s.img;
    photoEl.classList.add('show');
  } else {
    photoEl.classList.remove('show');
  }
  $('sceneName').textContent = '前日編' + (s.name && sceneId !== 'title' ? '：' + s.name : '');
  $('backBtn').disabled = history.length === 0;

  typeLine(s.lines[lineIdx]);

  const isLast = lineIdx >= s.lines.length - 1;
  const choices = (sceneId === 'title') ? titleChoices() : s.choices;
  choicesEl.innerHTML = '';
  if (isLast && choices) {
    choicesEl.classList.add('show');
    nextMark.style.visibility = 'hidden';
    for (const c of choices) {
      const b = document.createElement('button');
      b.className = 'choice';
      b.textContent = c.t;
      b.addEventListener('click', (ev) => { ev.stopPropagation(); go(c.to, c.line || 0); });
      choicesEl.appendChild(b);
    }
  } else {
    choicesEl.classList.remove('show');
    nextMark.style.visibility = 'visible';
  }
  persist();
}
function go(id, line){
  history.push({ scene: sceneId, line: lineIdx });
  if (history.length > 200) history.shift();
  sceneId = id; lineIdx = line || 0;
  render();
}
function back(){
  const prev = history.pop();
  if (!prev) return;
  sceneId = prev.scene; lineIdx = prev.line;
  render();
}
function restart(){
  history = [];
  sceneId = 'title'; lineIdx = 0;
  render();
}
function advance(){
  if (typing !== null) { finishLine(); return; }
  const s = SCENES[sceneId];
  if (lineIdx < s.lines.length - 1) {
    history.push({ scene: sceneId, line: lineIdx });
    lineIdx++;
    render();
    return;
  }
  const choices = (sceneId === 'title') ? titleChoices() : s.choices;
  if (choices) return;            /* wait for a choice */
  if (s.next) go(s.next);
}
$('stage').addEventListener('click', advance);
$('textwin').addEventListener('click', advance);
$('backBtn').addEventListener('click', (ev) => { ev.stopPropagation(); back(); });
$('restartBtn').addEventListener('click', (ev) => { ev.stopPropagation(); restart(); });
document.addEventListener('keydown', (e) => {
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); advance(); }
  if (e.key === 'ArrowLeft') back();
});
render();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js')
    .then((reg) => { reg.update().catch(() => {}); })
    .catch(() => {});
}
</script>
</body>
</html>
