/* ===== save keys ===== */
const SAVE_KEY = 'adv_save_v1';
const CLEAR_KEY = 'adv_cleared_v1';

/* ===== state ===== */
let sceneId = 'title';
let lineIdx = 0;
let history = [];       // [{scene, line}]
let typing = null;      // typewriter timer id
let fullLine = '';

const $ = (id) => document.getElementById(id);
const photoEl = $('photo');
const titleEl = $('titleCard');
const textEl = $('text');
const choicesEl = $('choices');
const nextMark = $('nextMark');

/* ===== save / load ===== */
function loadSave(){
  try { return JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); } catch (e) { return null; }
}
function persist(){
  if (sceneId === 'title') return;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({ scene: sceneId, line: lineIdx })); } catch (e) {}
  if (sceneId === 'ending') {
    try { localStorage.setItem(CLEAR_KEY, new Date().toISOString()); } catch (e) {}
  }
}

/* ===== typewriter ===== */
function stopTyping(){ if (typing !== null) { clearInterval(typing); typing = null; } }
function typeLine(text){
  stopTyping();
  fullLine = text;
  textEl.textContent = '';
  let i = 0;
  typing = setInterval(() => {
    i++;
    textEl.textContent = text.slice(0, i);
    if (i >= text.length) stopTyping();
  }, 26);
}
function finishLine(){
  if (typing !== null) { stopTyping(); textEl.textContent = fullLine; }
}

/* ===== choices for the title scene ===== */
function titleChoices(){
  const save = loadSave();
  const list = [];
  if (save && SCENES[save.scene] && save.scene !== 'title') {
    list.push({ t: 'つづきから', to: save.scene, line: save.line || 0 });
  }
  list.push({ t: save ? 'はじめから' : 'はじめる', to: 'prologue' });
  return list;
}

/* ===== rendering ===== */
let photoToken = 0;
let shownImg = null;   // img src actually on screen
let pendingImg = null; // img src currently transitioning in
function updatePhoto(target){
  if (!target) {
    photoToken++; pendingImg = null; shownImg = null;
    photoEl.classList.remove('show');
    return;
  }
  if (target === shownImg) { photoEl.classList.add('show'); return; }
  if (target === pendingImg) return; // transition already in flight
  const token = ++photoToken;
  pendingImg = target;
  photoEl.classList.remove('show'); // fade the old image out first
  const pre = new Image();
  const loaded = new Promise(res => { pre.onload = res; pre.onerror = res; });
  pre.src = target;
  const faded = new Promise(res => setTimeout(res, 480)); // wait for fade-out (.45s)
  const giveUp = new Promise(res => setTimeout(res, 2000)); // never stall the story
  Promise.race([Promise.all([loaded, faded]), giveUp]).then(() => {
    if (token !== photoToken) return;
    photoEl.src = target; // swap only while black & fully loaded
    shownImg = target; pendingImg = null;
    requestAnimationFrame(() => { if (token === photoToken) photoEl.classList.add('show'); });
  });
}
function render(){
  const s = SCENES[sceneId];
  titleEl.classList.toggle('show', !!s.title);
  $('clearNote').style.display = localStorage.getItem(CLEAR_KEY) ? 'block' : 'none';
  updatePhoto(s.img || null);
  $('sceneName').textContent = '前日編' + (s.name && sceneId !== 'title' ? '：' + s.name : '');
  $('backBtn').disabled = history.length === 0;

  typeLine(s.lines[lineIdx]);

  const isLast = lineIdx >= s.lines.length - 1;
  const choices = (sceneId === 'title') ? titleChoices() : s.choices;
  choicesEl.innerHTML = '';
  if (isLast && choices) {
    choicesEl.classList.add('show');
    nextMark.style.visibility = 'hidden';
    for (const c of choices) {
      const b = document.createElement('button');
      b.className = 'choice';
      b.textContent = c.t;
      b.addEventListener('click', (ev) => { ev.stopPropagation(); go(c.to, c.line || 0); });
      choicesEl.appendChild(b);
    }
  } else {
    choicesEl.classList.remove('show');
    nextMark.style.visibility = 'visible';
  }
  persist();
}
function go(id, line){
  history.push({ scene: sceneId, line: lineIdx });
  if (history.length > 200) history.shift();
  sceneId = id; lineIdx = line || 0;
  render();
}
function back(){
  const prev = history.pop();
  if (!prev) return;
  sceneId = prev.scene; lineIdx = prev.line;
  render();
}
function restart(){
  history = [];
  sceneId = 'title'; lineIdx = 0;
  render();
}
function advance(){
  if (typing !== null) { finishLine(); return; }
  const s = SCENES[sceneId];
  if (lineIdx < s.lines.length - 1) {
    history.push({ scene: sceneId, line: lineIdx });
    lineIdx++;
    render();
    return;
  }
  const choices = (sceneId === 'title') ? titleChoices() : s.choices;
  if (choices) return;            /* wait for a choice */
  if (s.next) go(s.next);
}
$('stage').addEventListener('click', advance);
$('textwin').addEventListener('click', advance);
$('backBtn').addEventListener('click', (ev) => { ev.stopPropagation(); back(); });
$('restartBtn').addEventListener('click', (ev) => { ev.stopPropagation(); restart(); });
document.addEventListener('keydown', (e) => {
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); advance(); }
  if (e.key === 'ArrowLeft') back();
});
render();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js')
    .then((reg) => { reg.update().catch(() => {}); })
    .catch(() => {});
}
